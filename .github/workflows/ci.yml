name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Unit tests, then the lint ratchet (counts may only go down).
      - run: npm test
      # Build the store package and check every referenced file is in it and
      # nothing dev-only leaked in.
      - run: npm run check-build
